<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeedTask</title>
<meta name="description" content="習慣は、スワイプで終わらせる。">
<meta name="theme-color" content="#F4F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1110" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SpeedTask">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
</head>
<body>
<!--APP-START-->
<style>
/* Layout: one quiet phone column. "今日" is a card stack and a clock; "記録" is three numbers, a month, and a list. Nothing else. */
:root {
  --bg: #F4F5F3;
  --surface: #FFFFFF;
  --ink: #141716;
  --sub: #6C7470;
  --faint: #A8AFAB;
  --line: #E3E6E3;
  --accent: #1FCB8F;
  --accent-ink: #0A7350;
  --accent-soft: #D7F4E7;
  --on-ink-accent: #5BF0BC;
  --flame: #FF7A2F;
  --danger: #D93D62;
  --card-ink: rgba(12, 14, 13, .9);
  --shadow: 0 22px 44px -26px rgba(20, 23, 22, .55);
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --gutter: 20px;
  --peek: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1110; --surface: #171B19; --ink: #EDF1EF; --sub: #9AA39F; --faint: #5D6662; --line: #252A28;
    --accent: #2EE0A6; --accent-ink: #7DEFC8; --accent-soft: #13392B; --on-ink-accent: #0A7350;
    --flame: #FF8A45; --danger: #FF6D8C; --shadow: 0 22px 44px -22px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1110; --surface: #171B19; --ink: #EDF1EF; --sub: #9AA39F; --faint: #5D6662; --line: #252A28;
  --accent: #2EE0A6; --accent-ink: #7DEFC8; --accent-soft: #13392B; --on-ink-accent: #0A7350;
  --flame: #FF8A45; --danger: #FF6D8C; --shadow: 0 22px 44px -22px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.sr-only:not(:focus) { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.flame { width: 1em; height: 1em; color: var(--flame); flex-shrink: 0; }

#app { position: relative; height: 100%; max-width: 440px; margin-inline: auto; }
.view { position: absolute; inset: 0; padding-inline: var(--gutter); display: flex; flex-direction: column; }
.page { overflow-y: auto; gap: 36px; padding-bottom: 40px; overscroll-behavior: contain; }

.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--sub); display: grid; place-items: center; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:not(:disabled):active { background: var(--line); }
.icon-btn:disabled { opacity: .3; }

/* ---------- 今日 ---------- */
.topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 56px; }
.count { justify-self: center; font-size: 13px; font-weight: 800; color: var(--sub); display: flex; align-items: baseline; gap: 4px; }
.count b { font-size: 22px; font-weight: 900; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
.streak { justify-self: end; padding-right: 8px; display: flex; align-items: center; gap: 3px; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; }

.clock { text-align: center; font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; padding-top: 2px; transition: color .3s; }
.clock small { font-size: 15px; font-weight: 800; letter-spacing: 0; margin-left: 2px; }
.clock[data-mode="idle"], .clock[data-mode="held"] { color: var(--faint); }

.stage { position: relative; flex: 1; min-height: 260px; }
.stack { position: absolute; inset: 20px 0 4px; margin: auto; width: min(100%, 340px); max-height: 460px; touch-action: none; }
.card {
  position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--peek) * 2);
  border-radius: 28px; background: var(--c); color: var(--card-ink); box-shadow: var(--shadow);
  padding: 22px 24px 26px; display: flex; flex-direction: column; justify-content: space-between;
  transform: translateY(calc(var(--i, 0) * var(--peek) * -1)) scale(calc(1 - var(--i, 0) * .06));
  transform-origin: 50% 0; transition: transform .36s var(--ease), opacity .36s;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; will-change: transform;
}
.card.top { cursor: grab; }
.card.dragging { transition: none; cursor: grabbing; }
.card.flying { transition: transform .42s var(--ease), opacity .42s; opacity: 0; pointer-events: none; }
.card.enter { opacity: 0; transform: translateY(calc(var(--i, 0) * var(--peek) * -1 - 12px)) scale(.9); }
.card-meta { display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; opacity: .72; min-height: 20px; }
.card-meta .flame { color: inherit; }
.card-name { font-size: clamp(24px, 7.4vw, 31px); font-weight: 800; line-height: 1.28; overflow-wrap: anywhere; word-break: auto-phrase; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.stamp { position: absolute; top: 20px; padding: 3px 14px; border-radius: 999px; border: 2.5px solid currentColor; font-size: 15px; font-weight: 900; pointer-events: none; }
.stamp.ok { right: 18px; transform: rotate(8deg); opacity: var(--ok, 0); }
.stamp.no { left: 18px; transform: rotate(-8deg); opacity: var(--no, 0); }

.foot { height: 72px; flex-shrink: 0; display: grid; place-items: center; }
.hint { margin: 0; display: flex; gap: 32px; font-size: 12px; font-weight: 800; color: var(--faint); }

.finish, .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.done-mark { width: 64px; height: 58px; margin-bottom: 18px; }
.done-pct { font-size: 72px; font-weight: 900; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.done-pct small { font-size: 26px; letter-spacing: 0; margin-left: 2px; }
.done-pct.perfect { color: var(--accent-ink); }
.done-line { margin: 10px 0 0; font-size: 18px; font-weight: 800; }
.week { display: flex; gap: 14px; margin-top: 30px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; color: var(--faint); }
.wd i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.wd.on i { background: var(--accent); }
.wd.part i { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.wd.today { color: var(--ink); }
.done-sub { margin: 18px 0 0; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; color: var(--sub); font-variant-numeric: tabular-nums; }
.done-sub .sep { color: var(--faint); margin-inline: 4px; }
.text-link { border: 0; background: none; padding: 10px 12px; margin-top: 6px; font-size: 13px; font-weight: 800; color: var(--accent-ink); }
.celebrate > * { animation: rise .6s var(--ease) both; }
.celebrate > :nth-child(2) { animation-delay: .06s; }
.celebrate > :nth-child(3) { animation-delay: .12s; }
.celebrate > :nth-child(4) { animation-delay: .2s; }
.celebrate > :nth-child(5) { animation-delay: .26s; }
.celebrate > :nth-child(6) { animation-delay: .32s; }
.celebrate .done-mark { animation: pop .7s cubic-bezier(.2, .9, .3, 1.4) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { opacity: 0; transform: scale(.5) rotate(-10deg); } }
.empty p { margin: 0 0 18px; font-size: 17px; font-weight: 800; line-height: 1.7; }
.pill-btn { border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 800; padding: 11px 22px; }

.snack {
  position: absolute; z-index: 40; left: 50%; bottom: 14px; transform: translate(-50%, 12px);
  display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 18px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 800; white-space: nowrap;
  opacity: 0; visibility: hidden; transition: opacity .2s, transform .25s var(--ease), visibility 0s .25s;
}
.snack.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .2s, transform .25s var(--ease); }
.snack button { border: 0; border-radius: 999px; background: transparent; color: var(--on-ink-accent); font-weight: 900; padding: 6px 12px; }
.snack.no-action { padding-right: 18px; }

/* ---------- 記録 / 習慣 ---------- */
.page-top { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 56px; margin-inline: calc(var(--gutter) * -1); padding-inline: 8px; background: var(--bg); flex-shrink: 0; }
.back { justify-self: start; display: flex; align-items: center; border: 0; background: none; color: var(--sub); font-size: 14px; font-weight: 800; padding: 8px; }
.back svg { width: 20px; height: 20px; }
.page-title { margin: 0; font-size: 16px; font-weight: 900; }
.link { justify-self: end; border: 0; background: none; color: var(--accent-ink); font-size: 14px; font-weight: 800; padding: 8px 12px; }
.label { margin: 0 0 12px; font-size: 12px; font-weight: 800; color: var(--sub); letter-spacing: .04em; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 8px; }
.stat { min-width: 0; }
.stat b { display: block; font-size: 30px; font-weight: 900; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b small { font-size: 13px; font-weight: 800; letter-spacing: 0; margin-left: 2px; }
.stat span { font-size: 11px; font-weight: 800; color: var(--sub); }

.month { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.month h2 { margin: 0; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
.month div { display: flex; margin-right: -10px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; }
.dow { font-size: 10px; font-weight: 800; color: var(--faint); padding-bottom: 2px; }
.day { justify-self: center; width: min(40px, 100%); aspect-ratio: 1; border: 0; border-radius: 50%; background: transparent; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; display: grid; place-items: center; position: relative; }
.day.full { background: var(--accent); color: #062C1F; }
.day.part { background: var(--accent-soft); color: var(--accent-ink); }
.day.future { color: var(--faint); }
.day.today::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.day.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }

.detail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.detail-head h2 { margin: 0; font-size: 15px; font-weight: 900; }
.detail-head span { font-size: 13px; font-weight: 800; color: var(--sub); font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-size: 15px; font-weight: 700; min-width: 0; }
.rows li:last-child .row { border-bottom: 0; }
.row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .state { font-size: 12px; font-weight: 800; color: var(--faint); flex-shrink: 0; }
.row.is-done .state { color: var(--sub); }
.mark { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; }
.mark svg { width: 14px; height: 14px; }
.mark.done { background: var(--c); color: var(--card-ink); }
.mark.miss { box-shadow: inset 0 0 0 2px var(--line); color: var(--faint); }
.mark.none, .mark.pending { border: 2px dashed var(--line); }
.fine { margin: 10px 0 0; font-size: 12px; font-weight: 700; color: var(--faint); }

.habit-stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.habit-stats li { display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.habit-stats .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.habit-stats .st { display: flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; color: var(--sub); font-variant-numeric: tabular-nums; }
.habit-stats .st .flame { color: var(--faint); }
.habit-stats .pct { width: 44px; text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }

.sample { margin: 0; font-size: 12px; font-weight: 700; color: var(--sub); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sample button { border: 0; background: none; padding: 4px 6px; font-size: 12px; font-weight: 800; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }

.edit-list { list-style: none; margin: 0; padding: 0; }
.edit-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); transition: border-color .2s; }
.edit-row:focus-within { border-bottom-color: var(--ink); }
.swatch { width: 26px; height: 26px; flex-shrink: 0; border: 0; border-radius: 50%; background: var(--c); }
.edit-row input, .add-row input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; font-weight: 700; padding: 13px 0; }
.edit-row input:focus, .add-row input:focus { outline: none; }
.mini { width: 36px; height: 36px; flex-shrink: 0; border: 0; border-radius: 50%; background: transparent; color: var(--faint); display: grid; place-items: center; }
.mini svg { width: 18px; height: 18px; }
.mini:disabled { opacity: .3; }
.mini.armed { width: auto; border-radius: 999px; padding-inline: 12px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 800; }
.add-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.add-row:focus-within { border-bottom-color: var(--ink); }
.add-row .plus { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 2px dashed var(--faint); display: grid; place-items: center; color: var(--faint); }
.add-row .plus svg { width: 14px; height: 14px; }
.add-row button { border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 800; padding: 6px 14px; }
.danger-link, .plain-link { display: block; border: 0; background: none; padding: 10px 0; font-size: 14px; font-weight: 800; text-align: left; }
.danger-link { color: var(--danger); }

@media (max-height: 680px) {
  .clock { font-size: 34px; }
  .foot { height: 56px; }
  .done-pct { font-size: 56px; }
  .week { margin-top: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
</style>

<div id="app">
  <!-- 今日 -->
  <main class="view" id="view-today" aria-label="今日">
    <header class="topbar">
      <button class="icon-btn" data-go="records" aria-label="記録を見る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </button>
      <div class="count" id="count" aria-live="polite"></div>
      <div class="streak" aria-label="連続日数"><svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flame"/></svg><span id="streakNum">0</span></div>
    </header>
    <div class="clock" id="clock" data-mode="idle" aria-hidden="true"></div>
    <section class="stage">
      <div class="stack" id="stack"></div>
      <div class="finish" id="done" hidden>
        <svg class="done-mark" viewBox="0 0 120 110" aria-hidden="true"><use href="#i-logo"/></svg>
        <div class="done-pct" id="donePct"></div>
        <p class="done-line" id="doneLine"></p>
        <div class="week" id="week" aria-label="直近7日"></div>
        <p class="done-sub" id="doneSub"></p>
        <button class="text-link" id="retryBtn" hidden></button>
      </div>
      <div class="empty" id="empty" hidden>
        <p>習慣をひとつ決めて、<br>今日をはじめよう。</p>
        <button class="pill-btn" data-go="settings">習慣を追加</button>
      </div>
    </section>
    <div class="foot">
      <p class="hint" id="hint" aria-hidden="true"><span>← できなかった</span><span>やった →</span></p>
      <button class="sr-only" id="srDone"></button>
      <button class="sr-only" id="srMiss"></button>
    </div>
  </main>

  <!-- 記録 -->
  <main class="view page" id="view-records" aria-label="記録" hidden>
    <header class="page-top">
      <button class="back" data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>今日</button>
      <h1 class="page-title">記録</h1>
      <button class="link" data-go="settings">編集</button>
    </header>
    <section class="stats">
      <div class="stat"><b id="statStreak"></b><span>連続</span></div>
      <div class="stat"><b id="statRate"></b><span>30日の達成率</span></div>
      <div class="stat"><b id="statBest"></b><span>ベストタイム</span></div>
    </section>
    <section>
      <div class="month">
        <h2 id="monthTitle"></h2>
        <div>
          <button class="icon-btn" id="prevMonth" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
          <button class="icon-btn" id="nextMonth" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
      </div>
      <div class="cal" id="cal"></div>
    </section>
    <section>
      <div class="detail-head"><h2 id="detailTitle"></h2><span id="detailMeta"></span></div>
      <ul class="rows" id="detailRows"></ul>
      <p class="fine" id="detailHint"></p>
    </section>
    <section>
      <p class="label">習慣ごと・30日</p>
      <ul class="habit-stats" id="habitStats"></ul>
    </section>
    <p class="sample" id="sampleNote" hidden>サンプルの記録を表示しています。<button data-clear-sample>サンプルを消す</button></p>
  </main>

  <!-- 習慣 -->
  <main class="view page" id="view-settings" aria-label="習慣" hidden>
    <header class="page-top">
      <button class="back" data-go="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>記録</button>
      <h1 class="page-title">習慣</h1>
      <span></span>
    </header>
    <section>
      <ul class="edit-list" id="editList"></ul>
      <form class="add-row" id="addForm" autocomplete="off">
        <span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <input id="addInput" maxlength="30" placeholder="習慣を追加" aria-label="習慣を追加" enterkeyhint="done">
        <button type="submit" id="addBtn" hidden>追加</button>
      </form>
      <p class="fine">上から順にカードが積まれます。丸をタップで色が変わります。</p>
    </section>
    <section>
      <p class="label">データ</p>
      <button class="plain-link" id="clearSampleBtn" data-clear-sample hidden>サンプルの記録を消す</button>
      <button class="danger-link" id="wipeBtn">すべての記録を消す</button>
      <p class="fine">記録はこの端末のブラウザにだけ保存されます。</p>
    </section>
  </main>

  <div class="snack" id="snack" role="status"><span id="snackText"></span><button id="snackAct" hidden></button></div>
  <div class="sr-only" id="announce" aria-live="polite"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12.7 2.2c.5 2.7 2.1 4.4 3.6 6 1.4 1.5 2.5 3.1 2.5 5.4A6.6 6.6 0 0 1 12 20.4a6.6 6.6 0 0 1-6.8-6.6c0-2.4 1-4 2.4-5.3.2 1.7 1 2.8 2.1 3.3-.4-3.7.9-7 3-9.6z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4 4L18.5 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cross" viewBox="0 0 24 24"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-logo" viewBox="0 0 120 110">
    <rect x="16" y="26" width="62" height="70" rx="15" fill="#FF6E95" transform="rotate(-16 47 61)"/>
    <rect x="24" y="22" width="62" height="70" rx="15" fill="#FFCB45" transform="rotate(-7 55 57)"/>
    <rect x="34" y="18" width="66" height="72" rx="16" fill="#3DDC9F"/>
    <path d="M51 54l11 11 22-23" fill="none" stroke="#0C0E0D" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<script>
(() => {
  'use strict';

  // ---------- helpers ----------
  const COLORS = { mint: '#3DDC9F', orange: '#FF9447', pink: '#FF6E95', purple: '#B47DFF', blue: '#5AAAFF', yellow: '#FFCB45' };
  const COLOR_NAMES = { mint: 'ミント', orange: 'オレンジ', pink: 'ピンク', purple: 'パープル', blue: 'ブルー', yellow: 'イエロー' };
  const COLOR_KEYS = Object.keys(COLORS);
  const STORE_KEY = 'speedtask.v1';
  const MAX_HABITS = 12;
  const DOW = ['日', '月', '火', '水', '木', '金', '土'];
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const todayKey = () => keyOf(new Date());
  const uid = () => Math.random().toString(36).slice(2, 10);
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const colorOf = (key) => COLORS[key] || COLORS.mint;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const FLAME = '<svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flame"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg>';
  const CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cross"/></svg>';
  const dayLabel = (k) => { const d = parseKey(k); return `${d.getMonth() + 1}月${d.getDate()}日（${DOW[d.getDay()]}）`; };

  function fmtSecs(s) {
    if (s == null) return '—';
    if (s < 60) return `${s.toFixed(2)}<small>秒</small>`;
    if (s < 3600) return `${Math.floor(s / 60)}<small>分</small>${pad(Math.floor(s % 60))}<small>秒</small>`;
    return `${Math.floor(s / 3600)}<small>時間</small>${pad(Math.floor((s % 3600) / 60))}<small>分</small>`;
  }
  function plainSecs(s) {
    if (s < 60) return `${s.toFixed(2)}秒`;
    if (s < 3600) return `${Math.floor(s / 60)}分${Math.floor(s % 60)}秒`;
    return `${Math.floor(s / 3600)}時間${Math.floor((s % 3600) / 60)}分`;
  }

  // ---------- state ----------
  function defaultHabits() {
    return [['Run5km', 'mint'], ['Claudecodeを開く', 'orange'], ['入門問題英文精講をとく', 'pink'], ['Xポストする', 'purple'], ['Leap開く', 'blue']]
      .map(([name, color]) => ({ id: uid(), name, color }));
  }
  function seed() {
    const habits = defaultHabits();
    const days = {};
    const t = todayKey();
    const all = habits.map((h) => h.id);
    // Sample history (sample:true, clearable in the app): the last 2 days recorded (streak 2),
    // a missed day before that, and a mix of perfect and partial days further back.
    for (let i = 24; i >= 1; i--) {
      const k = addDays(t, -i);
      if (i === 3 || i === 11 || i === 19) continue;
      const secs = +(5.4 + ((i * 47) % 61) / 10).toFixed(2);
      const partial = i === 1 || i === 5 || i === 8 || i === 15 || i === 21;
      const done = partial ? all.filter((_, j) => (j + i) % 4 !== 0) : all.slice();
      days[k] = { done, skipped: all.filter((id) => !done.includes(id)), seconds: secs, total: all.length, finished: true, complete: !partial, sample: true };
    }
    return { habits, days, session: null, sample: true, onboarded: false };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!s || !Array.isArray(s.habits) || !s.days) return null;
      Object.values(s.days).forEach((d) => {
        if (!Array.isArray(d.skipped)) d.skipped = [];
        if (d.finished === undefined) d.finished = !!d.complete;
      });
      s.habits.forEach((h) => { if (!COLORS[h.color]) h.color = 'blue'; });
      if (s.session) s.session.history = (s.session.history || []).filter((a) => ['done', 'pass', 'retry'].includes(a.type));
      if (s.onboarded === undefined) s.onboarded = true;
      return s;
    } catch (e) { return null; }
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }

  let state = load() || seed();
  const today = () => state.days[state.session.date];
  const habitById = (id) => state.habits.find((h) => h.id === id);
  const judged = (day, id) => day.done.includes(id) || day.skipped.includes(id);
  const newDay = () => ({ done: [], skipped: [], seconds: null, total: state.habits.length, finished: false, complete: false });

  function ensureSession() {
    const t = todayKey();
    if (!state.session || state.session.date !== t) state.session = { date: t, queue: [], history: [], startedAt: null, finishedAt: null };
    if (!state.days[t]) state.days[t] = newDay();
    const s = state.session, day = state.days[t];
    const ids = new Set(state.habits.map((h) => h.id));
    day.done = day.done.filter((id) => ids.has(id));
    day.skipped = day.skipped.filter((id) => ids.has(id) && !day.done.includes(id));
    s.queue = s.queue.filter((id, i, a) => ids.has(id) && !judged(day, id) && a.indexOf(id) === i);
    state.habits.forEach((h) => { if (!judged(day, h.id) && !s.queue.includes(h.id)) s.queue.push(h.id); });
    s.history = s.history
      .map((a) => (a.type === 'retry' ? { ...a, ids: a.ids.filter((id) => ids.has(id)) } : a))
      .filter((a) => (a.type === 'retry' ? a.ids.length : ids.has(a.id)));
    refreshComplete();
  }
  // finished = every card swiped today; complete = every habit done.
  function refreshComplete() {
    const s = state.session, day = today();
    day.total = state.habits.length;
    day.finished = day.total > 0 && s.queue.length === 0;
    day.complete = day.finished && day.done.length === day.total;
    if (day.finished && !s.finishedAt) {
      s.finishedAt = Date.now();
      if (day.seconds == null && s.startedAt) day.seconds = +((s.finishedAt - s.startedAt) / 1000).toFixed(2);
    }
    if (!day.finished) s.finishedAt = null;
  }
  const retrying = () => !today().finished && today().seconds != null;
  // A day counts toward the streak once every card was swiped, even while misses are being redone.
  const recorded = (d) => !!d && (d.finished || d.seconds != null);

  function overallStreak() {
    let k = todayKey();
    if (!recorded(state.days[k])) k = addDays(k, -1);
    let n = 0;
    while (recorded(state.days[k])) { n++; k = addDays(k, -1); }
    return n;
  }
  function habitStreak(id) {
    let k = todayKey();
    if (!state.days[k]?.done.includes(id)) k = addDays(k, -1);
    let n = 0;
    while (state.days[k]?.done.includes(id)) { n++; k = addDays(k, -1); }
    return n;
  }
  // Best time only counts days where everything was done, so passing every card fast doesn't win.
  function bestTime() {
    const times = Object.values(state.days).filter((r) => r.complete && r.seconds != null).map((r) => r.seconds);
    return times.length ? Math.min(...times) : null;
  }
  function windowKeys(n) {
    const t = todayKey();
    const earliest = Object.keys(state.days).sort()[0] || t;
    const keys = [];
    for (let i = n - 1; i >= 0; i--) { const k = addDays(t, -i); if (k >= earliest) keys.push(k); }
    return keys;
  }

  // ---------- actions ----------
  function act(type, startHint) {
    const s = state.session;
    if (!s.queue.length) return;
    const id = s.queue.shift();
    if (!s.startedAt) s.startedAt = startHint || Date.now();
    (type === 'done' ? today().done : today().skipped).push(id);
    s.history.push({ type, id });
    state.onboarded = true;
    refreshComplete();
    save();
  }
  function retryMisses() {
    const s = state.session, day = today();
    if (!day.skipped.length) return;
    const ids = day.skipped.slice();
    day.skipped = [];
    s.queue.push(...ids);
    s.history.push({ type: 'retry', ids });
    refreshComplete();
    save();
    render();
  }
  function undo() {
    const s = state.session, day = today();
    const a = s.history.pop();
    if (!a) return;
    const wasFinished = day.finished;
    if (a.type === 'retry') {
      s.queue = s.queue.filter((x) => !a.ids.includes(x));
      day.skipped.push(...a.ids);
    } else {
      day.done = day.done.filter((x) => x !== a.id);
      day.skipped = day.skipped.filter((x) => x !== a.id);
      s.queue = s.queue.filter((x) => x !== a.id);
      s.queue.unshift(a.id);
      // Undoing the very first finish reopens the clock; after a redo the first time is kept.
      if (wasFinished && !s.history.some((h) => h.type === 'retry')) day.seconds = null;
    }
    if (!s.history.length) { s.startedAt = null; day.seconds = null; }
    refreshComplete();
    save();
    hideSnack();
    render();
  }
  // Correct a record from the calendar. Past days are closed records: anything not done counts as not done.
  function setStatus(k, id, next) {
    const isToday = k === todayKey();
    const d = state.days[k] || (state.days[k] = newDay());
    d.done = d.done.filter((x) => x !== id);
    d.skipped = d.skipped.filter((x) => x !== id);
    if (next === 'done') d.done.push(id);
    else if (next === 'miss') d.skipped.push(id);
    if (isToday) {
      const s = state.session;
      s.queue = s.queue.filter((x) => x !== id);
      if (next === 'pending') s.queue.unshift(id);
      s.history = [];
      refreshComplete();
    } else {
      const ids = state.habits.map((h) => h.id);
      d.total = ids.length;
      d.skipped = ids.filter((x) => !d.done.includes(x));
      d.finished = true;
      d.complete = d.done.length === d.total;
    }
    save();
  }

  // ---------- 今日 ----------
  const stack = $('#stack');
  const cardEls = new Map();

  function cardFor(id) {
    let el = cardEls.get(id);
    if (el) return [el, false];
    el = document.createElement('div');
    el.className = 'card enter';
    el.dataset.id = id;
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = '<div class="card-meta"></div><div class="card-name"></div><span class="stamp ok">やった！</span><span class="stamp no">できなかった</span>';
    stack.appendChild(el);
    cardEls.set(id, el);
    return [el, true];
  }

  function renderToday() {
    const s = state.session, day = today(), total = state.habits.length;
    const visible = s.queue.slice(0, 3);
    for (const [id, el] of cardEls) if (!visible.includes(id)) { el.remove(); cardEls.delete(id); }
    visible.forEach((id, i) => {
      const h = habitById(id);
      const [el, fresh] = cardFor(id);
      el.style.setProperty('--c', colorOf(h.color));
      el.style.setProperty('--i', i);
      el.style.zIndex = String(10 - i);
      el.classList.toggle('top', i === 0);
      el.querySelector('.card-name').textContent = h.name;
      const n = habitStreak(id);
      el.querySelector('.card-meta').innerHTML = n ? `${FLAME}${n}日` : '';
      if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
    });

    const top = s.queue[0] && habitById(s.queue[0]);
    $('#srDone').hidden = $('#srMiss').hidden = !top;
    if (top) { $('#srDone').textContent = `${top.name}：やった`; $('#srMiss').textContent = `${top.name}：できなかった`; }

    $('#count').innerHTML = !total ? '' : day.finished ? esc(dayLabel(s.date)) : `あと<b>${s.queue.length}</b>枚`;
    $('#streakNum').textContent = overallStreak();
    $('#empty').hidden = total > 0;
    $('#hint').hidden = state.onboarded || day.finished || !total;

    const done = $('#done');
    const appearing = done.hidden && day.finished;
    done.hidden = !day.finished;
    if (day.finished) {
      const secs = day.seconds, nDone = day.done.length, nMiss = day.skipped.length;
      const pct = Math.round((nDone / total) * 100);
      $('#donePct').innerHTML = `${pct}<small>%</small>`;
      $('#donePct').classList.toggle('perfect', !nMiss);
      $('#doneLine').textContent = nMiss ? `${total}つ中${nDone}つ、できた。` : '全部できた。';
      // The time is only a side note, and only when the day was swiped in one sitting.
      const time = secs != null && secs < 3600 ? `<span class="sep">・</span>${plainSecs(secs)}` : '';
      $('#doneSub').innerHTML = `${FLAME}${overallStreak()}日連続${time}`;
      $('#retryBtn').hidden = !nMiss;
      $('#retryBtn').textContent = `できなかった${nMiss}つをやり直す`;
      let week = '';
      for (let i = 6; i >= 0; i--) {
        const k = addDays(todayKey(), -i), r = state.days[k];
        const cls = ['wd', r?.complete ? 'on' : recorded(r) ? 'part' : '', i === 0 ? 'today' : ''].join(' ');
        week += `<span class="${cls}"><i></i>${DOW[parseKey(k).getDay()]}</span>`;
      }
      $('#week').innerHTML = week;
      if (appearing && booted && !reduceMotion.matches) { done.classList.remove('celebrate'); void done.offsetWidth; done.classList.add('celebrate'); }
    }
    tick();
  }

  let booted = false;
  let raf = 0;
  function tick() {
    cancelAnimationFrame(raf);
    const s = state.session, day = today(), clock = $('#clock');
    clock.hidden = !state.habits.length || day.finished;
    if (clock.hidden) return;
    let secs = 0, mode = 'idle';
    if (retrying()) { secs = day.seconds; mode = 'held'; }
    else if (s.startedAt) { secs = (Date.now() - s.startedAt) / 1000; mode = 'running'; }
    clock.innerHTML = fmtSecs(secs);
    clock.dataset.mode = mode;
    if (mode === 'running' && current === 'today' && !document.hidden) raf = requestAnimationFrame(tick);
  }

  // ---------- feedback ----------
  let snackTimer = 0, snackFn = null;
  function snack(text, action, fn, ms = 4000) {
    $('#snackText').textContent = text;
    const b = $('#snackAct');
    b.hidden = !action;
    b.textContent = action || '';
    snackFn = fn || null;
    $('#snack').classList.toggle('no-action', !action);
    $('#snack').classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(hideSnack, ms);
  }
  function hideSnack() { $('#snack').classList.remove('show'); snackFn = null; }
  $('#snackAct').addEventListener('click', () => { const f = snackFn; hideSnack(); if (f) f(); });
  const announce = (t) => { $('#announce').textContent = t; };
  const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* unsupported */ } };

  // ---------- swipe ----------
  function fling(type, el, dy = 0, startHint) {
    if (!el) return;
    const dir = type === 'done' ? 1 : -1;
    const name = habitById(el.dataset.id)?.name || '';
    cardEls.delete(el.dataset.id);
    el.classList.remove('dragging', 'top');
    el.style.setProperty(type === 'done' ? '--ok' : '--no', 1);
    el.classList.add('flying');
    el.style.transform = `translate(${dir * (window.innerWidth * 0.8 + 180)}px, ${dy * 0.3 - 24}px) rotate(${dir * 22}deg)`;
    setTimeout(() => el.remove(), 460);
    act(type, startHint);
    buzz(type === 'done' ? 10 : [6, 30, 6]);
    render();
    snack(type === 'done' ? 'やった' : 'できなかった', '取り消す', undo);
    announce(`${name}、${type === 'done' ? 'やった' : 'できなかった'}。${today().finished ? '今日はおわり。' : `あと${state.session.queue.length}枚。`}`);
  }

  let drag = null;
  stack.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.card.top');
    if (!el || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { el, x: e.clientX, y: e.clientY, wall: Date.now(), dx: 0, dy: 0, lx: e.clientX, lt: performance.now(), v: 0 };
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  stack.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const now = performance.now();
    drag.dx = e.clientX - drag.x;
    drag.dy = e.clientY - drag.y;
    if (now > drag.lt) { drag.v = (e.clientX - drag.lx) / (now - drag.lt); drag.lx = e.clientX; drag.lt = now; }
    const el = drag.el;
    el.style.transform = `translate(${drag.dx}px, ${drag.dy * 0.3}px) rotate(${drag.dx / 20}deg)`;
    el.style.setProperty('--ok', clamp01(drag.dx / 80));
    el.style.setProperty('--no', clamp01(-drag.dx / 80));
  });
  function endDrag() {
    if (!drag) return;
    const { el, dx, dy, v, wall } = drag;
    drag = null;
    const far = Math.min(110, stack.clientWidth * 0.3);
    if (dx > far || (dx > 30 && v > 0.5)) return fling('done', el, dy, wall);
    if (dx < -far || (dx < -30 && v < -0.5)) return fling('pass', el, dy, wall);
    el.classList.remove('dragging');
    el.style.transform = '';
    el.style.setProperty('--ok', 0);
    el.style.setProperty('--no', 0);
  }
  stack.addEventListener('pointerup', endDrag);
  stack.addEventListener('pointercancel', endDrag);

  const topCard = () => stack.querySelector('.card.top:not(.flying)');
  $('#srDone').addEventListener('click', () => fling('done', topCard()));
  $('#srMiss').addEventListener('click', () => fling('pass', topCard()));
  $('#retryBtn').addEventListener('click', retryMisses);
  document.addEventListener('keydown', (e) => {
    if (current !== 'today' || e.target.closest('input')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); fling('done', topCard()); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); fling('pass', topCard()); }
    else if (e.key === 'z' || e.key === 'Backspace') { e.preventDefault(); undo(); }
  });

  // ---------- 記録 ----------
  let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
  let calSel = todayKey();

  function renderRecords() {
    const win = windowKeys(30);
    let doneSum = 0, totalSum = 0;
    win.forEach((k) => { const r = state.days[k]; doneSum += r ? r.done.length : 0; totalSum += r?.total || state.habits.length; });
    const rate = totalSum ? Math.round((doneSum / totalSum) * 100) : 0;
    $('#statStreak').innerHTML = `${overallStreak()}<small>日</small>`;
    $('#statRate').innerHTML = `${rate}<small>%</small>`;
    $('#statBest').innerHTML = fmtSecs(bestTime());

    const y = calMonth.getFullYear(), m = calMonth.getMonth(), t = todayKey();
    $('#monthTitle').textContent = `${y}年${m + 1}月`;
    let cal = DOW.map((d) => `<span class="dow">${d}</span>`).join('');
    cal += '<span></span>'.repeat(new Date(y, m, 1).getDay());
    const daysIn = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= daysIn; d++) {
      const k = `${y}-${pad(m + 1)}-${pad(d)}`, r = state.days[k];
      const cls = ['day'];
      if (k > t) cls.push('future');
      else if (r?.complete) cls.push('full');
      else if (recorded(r) || r?.done.length) cls.push('part');
      if (k === t) cls.push('today');
      if (k === calSel) cls.push('sel');
      const summary = r?.complete ? '全部できた' : recorded(r) ? `${r.done.length}/${r.total}` : '記録なし';
      cal += `<button class="${cls.join(' ')}" data-day="${k}" ${k > t ? 'disabled' : ''} aria-label="${m + 1}月${d}日 ${summary}" aria-pressed="${k === calSel}">${d}</button>`;
    }
    $('#cal').innerHTML = cal;
    $('#nextMonth').disabled = keyOf(new Date(y, m + 1, 1)) > t;

    renderDetail();

    $('#habitStats').innerHTML = state.habits.map((h) => {
      const n = win.filter((k) => state.days[k]?.done.includes(h.id)).length;
      const pct = win.length ? Math.round((n / win.length) * 100) : 0;
      return `<li style="--c:${colorOf(h.color)}"><i class="dot"></i><span class="name">${esc(h.name)}</span><span class="st">${FLAME}${habitStreak(h.id)}</span><span class="pct">${pct}%</span></li>`;
    }).join('') || '<li class="fine">習慣がありません</li>';
    $('#sampleNote').hidden = !state.sample;
  }

  function statusOf(k, id) {
    const r = state.days[k];
    if (r?.done.includes(id)) return 'done';
    if (r?.skipped.includes(id)) return 'miss';
    if (k === todayKey()) return 'pending';
    return recorded(r) ? 'miss' : 'none';
  }
  const STATUS_TEXT = { done: 'やった', miss: 'できなかった', pending: 'まだ', none: '' };

  function renderDetail() {
    const k = calSel, r = state.days[k], isToday = k === todayKey();
    $('#detailTitle').textContent = isToday ? `今日・${dayLabel(k)}` : dayLabel(k);
    let meta = '記録なし';
    if (recorded(r) || r?.done.length || r?.skipped.length) meta = `${r.done.length}/${r.total || state.habits.length}${r.seconds != null ? `・${plainSecs(r.seconds)}` : ''}`;
    $('#detailMeta').textContent = meta;
    $('#detailRows').innerHTML = state.habits.map((h) => {
      const st = statusOf(k, h.id);
      return `<li><button class="row is-${st}" data-habit="${h.id}" style="--c:${colorOf(h.color)}" aria-label="${esc(h.name)}：${STATUS_TEXT[st] || '記録なし'}。タップで変更">
        <span class="mark ${st}">${st === 'done' ? CHECK : st === 'miss' ? CROSS : ''}</span>
        <span class="name">${esc(h.name)}</span><span class="state">${STATUS_TEXT[st]}</span></button></li>`;
    }).join('');
    $('#detailHint').textContent = state.habits.length ? (isToday ? 'タップで記録を直せます。' : 'つけ忘れも、タップで直せます。') : '';
  }

  $('#cal').addEventListener('click', (e) => {
    const b = e.target.closest('[data-day]');
    if (!b || b.disabled) return;
    calSel = b.dataset.day;
    renderRecords();
  });
  $('#detailRows').addEventListener('click', (e) => {
    const b = e.target.closest('[data-habit]');
    if (!b) return;
    const k = calSel, id = b.dataset.habit, st = statusOf(k, id);
    const next = k === todayKey()
      ? { pending: 'done', done: 'miss', miss: 'pending' }[st]
      : st === 'done' ? 'miss' : 'done';
    setStatus(k, id, next);
    renderRecords();
    const nb = $(`#detailRows [data-habit="${id}"]`);
    if (nb) nb.focus({ preventScroll: true });
  });
  $('#prevMonth').addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderRecords(); });
  $('#nextMonth').addEventListener('click', () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderRecords(); });

  // ---------- 習慣 ----------
  function renderSettings() {
    $('#editList').innerHTML = state.habits.map((h, i) => `
      <li class="edit-row" data-id="${h.id}">
        <button class="swatch" data-act="color" style="--c:${colorOf(h.color)}" aria-label="色を変える（いまは${COLOR_NAMES[h.color] || ''}）"></button>
        <input id="habit-${h.id}" value="${esc(h.name)}" maxlength="30" aria-label="習慣の名前" enterkeyhint="done">
        <button class="mini" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="ひとつ上へ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button class="mini" data-act="del" aria-label="削除"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cross"/></svg></button>
      </li>`).join('');
    const full = state.habits.length >= MAX_HABITS;
    $('#addInput').disabled = full;
    $('#addInput').placeholder = full ? `習慣は${MAX_HABITS}個までです` : '習慣を追加';
    $('#addBtn').hidden = !$('#addInput').value.trim();
    $('#clearSampleBtn').hidden = !state.sample;
  }
  $('#editList').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const id = b.closest('.edit-row').dataset.id;
    const i = state.habits.findIndex((h) => h.id === id);
    const h = state.habits[i];
    const act_ = b.dataset.act;
    if (act_ === 'color') h.color = COLOR_KEYS[(COLOR_KEYS.indexOf(h.color) + 1) % COLOR_KEYS.length];
    else if (act_ === 'up' && i > 0) {
      [state.habits[i - 1], state.habits[i]] = [h, state.habits[i - 1]];
      const order = state.habits.map((x) => x.id);
      state.session.queue.sort((a, c) => order.indexOf(a) - order.indexOf(c));
    } else if (act_ === 'del') {
      if (!b.classList.contains('armed')) {
        b.classList.add('armed');
        b.textContent = '削除';
        setTimeout(() => { if (b.isConnected && b.classList.contains('armed')) renderSettings(); }, 3000);
        return;
      }
      state.habits.splice(i, 1);
    }
    ensureSession();
    save();
    renderSettings();
    if (act_ !== 'del') { const nb = $(`.edit-row[data-id="${id}"] [data-act="${act_}"]`); if (nb && !nb.disabled) nb.focus(); }
  });
  $('#editList').addEventListener('change', (e) => {
    const input = e.target.closest('input');
    if (!input) return;
    const h = habitById(input.closest('.edit-row').dataset.id);
    const v = input.value.trim();
    if (v) { h.name = v; save(); } else input.value = h.name;
  });
  $('#editList').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input')) e.target.blur(); });
  $('#addInput').addEventListener('input', () => { $('#addBtn').hidden = !$('#addInput').value.trim(); });
  $('#addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('#addInput').value.trim();
    if (!v || state.habits.length >= MAX_HABITS) return;
    const used = state.habits.map((h) => h.color);
    const color = COLOR_KEYS.find((c) => !used.includes(c)) || COLOR_KEYS[state.habits.length % COLOR_KEYS.length];
    state.habits.push({ id: uid(), name: v, color });
    $('#addInput').value = '';
    ensureSession();
    save();
    renderSettings();
    $('#addInput').focus();
  });
  $('#wipeBtn').addEventListener('click', (e) => {
    const b = e.currentTarget;
    if (!b.classList.contains('armed')) {
      b.classList.add('armed');
      b.textContent = 'もう一度タップで、すべて消します';
      setTimeout(() => { b.classList.remove('armed'); b.textContent = 'すべての記録を消す'; }, 3500);
      return;
    }
    b.classList.remove('armed');
    b.textContent = 'すべての記録を消す';
    state = { habits: state.habits.length ? state.habits : defaultHabits(), days: {}, session: null, sample: false, onboarded: true };
    cardEls.forEach((el) => el.remove());
    cardEls.clear();
    ensureSession();
    save();
    render();
    snack('すべての記録を消しました');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-clear-sample]')) return;
    Object.keys(state.days).forEach((k) => { if (state.days[k].sample) delete state.days[k]; });
    state.sample = false;
    ensureSession();
    save();
    render();
    snack('サンプルの記録を消しました');
  });

  // ---------- navigation ----------
  const VIEWS = ['today', 'records', 'settings'];
  let current = null;
  function go(v) {
    if (!VIEWS.includes(v)) v = 'today';
    const prev = current;
    current = v;
    VIEWS.forEach((n) => { $(`#view-${n}`).hidden = n !== v; });
    const el = $(`#view-${v}`);
    if (prev && prev !== v) {
      el.scrollTop = 0;
      if (v !== 'today') hideSnack();
      if (v === 'records' && prev === 'today') { calSel = todayKey(); const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); }
      if (!reduceMotion.matches) {
        const dir = VIEWS.indexOf(v) > VIEWS.indexOf(prev) ? 1 : -1;
        el.animate([{ opacity: 0, transform: `translateX(${dir * 20}px)` }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
    }
    const hash = v === 'today' ? '' : `#${v}`;
    if (location.hash !== hash) history.replaceState(null, '', hash || location.pathname + location.search);
    render();
  }
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
  window.addEventListener('hashchange', () => go(location.hash.slice(1)));

  function render() {
    if (current === 'today') renderToday();
    else if (current === 'records') renderRecords();
    else if (current === 'settings') renderSettings();
  }

  // Roll over to a new day while the app stays open.
  function checkDay() {
    if (state.session?.date === todayKey()) return;
    cardEls.forEach((el) => el.remove());
    cardEls.clear();
    ensureSession();
    save();
    render();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkDay(); tick(); } });
  setInterval(checkDay, 60000);

  ensureSession();
  save();
  go(location.hash.slice(1) || 'today');
  booted = true;

  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
<!--APP-END-->
</body>
</html>
