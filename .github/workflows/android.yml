name: Android

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Each run gets a higher versionCode, as Play requires for every upload.
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run sync:android

      - name: Build the test APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Decrypt the upload key
        if: env.HAS_KEY == 'true'
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/upload-keystore.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:PW
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the Play Store bundle (AAB)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: swipe-habit-test-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: swipe-habit-play-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Note when the bundle was skipped
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANDROID_KEYSTORE_PASSWORD is not set, so only the test APK was built. See docs/RELEASE.md."
