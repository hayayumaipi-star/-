name: Android

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Each run gets a higher versionCode, as Play requires for every upload.
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The runner image ships the Android SDK; Gradle fetches anything missing once the licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run sync:android

      - name: Build the test APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Decrypt the upload key
        if: env.HAS_KEY == 'true'
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/upload-keystore.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:PW
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the Play Store bundle (AAB)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: swipe-habit-test-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v5
        if: env.HAS_KEY == 'true'
        with:
          name: swipe-habit-play-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      # Without the real key, still prove the signed release bundle builds, using a throwaway key.
      - name: Check the signed bundle with a throwaway key
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/throwaway.jks" -alias upload -keyalg RSA -keysize 2048 \
            -validity 1 -storepass throwaway -keypass throwaway -dname "CN=throwaway"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/throwaway.jks" ANDROID_KEYSTORE_PASSWORD=throwaway ./gradlew --no-daemon bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1
          echo "::notice::ANDROID_KEYSTORE_PASSWORD is not set, so the Play bundle was only checked with a throwaway key and not kept. See docs/RELEASE.md."
